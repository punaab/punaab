name: Moltbook Heartbeat

# Backup cron every 30 minutes (required on Vercel Hobby — built-in cron is once/day).
# Set repository secrets:
#   CRON_SECRET — same value as Vercel env CRON_SECRET
#   PROD_URL    — https://www.punaab.com  (use www; bare domain 308-redirects and skips the tick)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production heartbeat
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PROD_URL: ${{ secrets.PROD_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$PROD_URL" ]; then
            echo "::error title=Heartbeat not configured::Add GitHub repository secrets CRON_SECRET and PROD_URL (https://www.punaab.com)."
            exit 1
          fi
          echo "Calling ${PROD_URL%/}/api/cron/heartbeat"
          body=$(curl -sS -f -L \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${PROD_URL%/}/api/cron/heartbeat")
          echo "$body"
          echo "$body" | grep -q '"ok":true' || { echo "::error::Heartbeat returned non-ok response"; exit 1; }
          echo "$body" | grep -q 'brain_error' && echo "::warning::Brain returned an error — check Anthropic credits / ANTHROPIC_API_KEY on Vercel"
