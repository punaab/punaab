name: Moltbook Heartbeat

# Optional backup cron when Vercel Hobby limits apply.
# Set repository secrets: CRON_SECRET (same as Vercel) and PROD_URL (e.g. https://punaab.com)
# If secrets are missing, this workflow skips cleanly (no failed runs).

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel heartbeat
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PROD_URL: ${{ secrets.PROD_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$PROD_URL" ]; then
            echo "::notice title=Heartbeat skipped::Add repository secrets CRON_SECRET and PROD_URL (e.g. https://punaab.com) to enable this workflow."
            exit 0
          fi
          curl -sS -f \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${PROD_URL%/}/api/cron/heartbeat"
